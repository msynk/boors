[package]
name = "boors-server"
description = "Boors HTTP node: serves the market-data API at /api/v1/* (the same dispatcher as the desktop's IPC), the built UI, and the collection scheduler in Iran time."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "boors-server"
path = "src/main.rs"

[dependencies]
boors-market.workspace = true
anyhow.workspace = true
axum = "0.8"
chrono.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["compression-gzip", "compression-br", "cors", "fs", "trace"] }
tracing.workspace = true
tracing-subscriber.workspace = true
